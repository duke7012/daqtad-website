[build]
  command = "react-router build"
  publish = "build/client"

[build.environment]
  SUPABASE_URL = "https://udoshvdfupwliujurjoz.supabase.co"
  SUPABASE_ANON_KEY = "sb_publishable_dcg169eXSLW0Bt9N_B4iLQ_Q80fCM1d"

[dev]
  command = "react-router dev"

# ============================================================== routing ====
# React Router owns the app URLs. Static files in public/ (world-map, sitemap)
# are served from build/client. Old addresses still 301 to the current ones.

# ---- old addresses -> new ones, so existing links and search results follow.

[[redirects]]
  from = "/event-vol-8.html"
  to = "/events/popup"
  status = 301
  force = true

[[redirects]]
  from = "/event-vol-8"
  to = "/events/popup"
  status = 301
  force = true

[[redirects]]
  from = "/events/vol-8"
  to = "/events/popup"
  status = 301
  force = true

[[redirects]]
  from = "/event-vol-7.html"
  to = "/events/rpd-ut1"
  status = 301
  force = true

[[redirects]]
  from = "/event-vol-7"
  to = "/events/rpd-ut1"
  status = 301
  force = true

[[redirects]]
  from = "/events/vol-7"
  to = "/events/rpd-ut1"
  status = 301
  force = true

[[redirects]]
  from = "/events/rdd-7"
  to = "/events/rpd-ut1"
  status = 301
  force = true

[[redirects]]
  from = "/events/rdd-8"
  to = "/events/rpd-ut2"
  status = 301
  force = true

[[redirects]]
  from = "/event.html"
  to = "/events/:slug"
  status = 301
  force = true
  [redirects.query]
    slug = ":slug"

[[redirects]]
  from = "/event.html"
  to = "/events"
  status = 301
  force = true

[[redirects]]
  from = "/event"
  to = "/events"
  status = 301
  force = true

[[redirects]]
  from = "/admin.html"
  to = "/admin"
  status = 301
  force = true

[[redirects]]
  from = "/world-map"
  to = "/world-map.html"
  status = 200

# ---- one canonical hostname.

[[redirects]]
  from = "https://www.daqtad.org/*"
  to = "https://daqtad.org/:splat"
  status = 301
  force = true

# ============================================================== headers ====

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
