<!DOCTYPE html><html><head><meta charset="utf-8">
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#fff;font-family:Manrope,sans-serif}</style>
</head><body>
<div id="map"></div>
<script>
(async () => {
  const topo = await (await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json')).json();
  const countries = topojson.feature(topo, topo.objects.countries);
  const W = 1000, H = 480;
  const proj = d3.geoNaturalEarth1().fitSize([W, H], { type: 'Sphere' });
  const path = d3.geoPath(proj);
  const svg = d3.select('#map').append('svg').attr('viewBox', `0 0 ${W} ${H}`).attr('style', 'width:100%;height:auto;display:block');
  svg.append('path').datum({ type: 'Sphere' }).attr('d', path).attr('fill', '#f6f5fc');
  svg.append('g').selectAll('path').data(countries.features).join('path')
    .attr('d', path).attr('fill', '#e5e2f2').attr('stroke', '#fff').attr('stroke-width', 0.6);
  const pts = [
    { name: 'Bến Tre, Vietnam', sub: 'where we started', coord: [106.375, 10.24], color: 'oklch(0.62 0.17 5)', dx: 14, dy: 26, anchor: 'start' },
    { name: 'Salt Lake City, UT', sub: 'home base now', coord: [-111.891, 40.76], color: 'oklch(0.55 0.17 285)', dx: 14, dy: -14, anchor: 'start' },
  ];
  svg.append('path')
    .datum({ type: 'LineString', coordinates: [pts[0].coord, pts[1].coord] })
    .attr('d', path).attr('fill', 'none')
    .attr('stroke', 'oklch(0.68 0.15 285)').attr('stroke-width', 2).attr('stroke-dasharray', '6 6').attr('stroke-linecap', 'round');
  const g = svg.append('g');
  pts.forEach((p) => {
    const [x, y] = proj(p.coord);
    g.append('circle').attr('cx', x).attr('cy', y).attr('r', 10).attr('fill', p.color).attr('opacity', 0.2);
    g.append('circle').attr('cx', x).attr('cy', y).attr('r', 5).attr('fill', p.color).attr('stroke', '#fff').attr('stroke-width', 2);
    g.append('text').attr('x', x + p.dx).attr('y', y + p.dy).attr('text-anchor', p.anchor)
      .attr('font-size', 15).attr('font-weight', 800).attr('fill', '#2a2735').text(p.name);
    g.append('text').attr('x', x + p.dx).attr('y', y + p.dy + 16).attr('text-anchor', p.anchor)
      .attr('font-size', 12).attr('font-weight', 600).attr('fill', '#78718c').text(p.sub);
  });
})();
</script>
</body></html>
